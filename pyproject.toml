[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iza-mine-passgate"
version = "0.1.0"
description = "对照设定的通过率门槛逐项判定，给出距离门槛的余量"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "iza-mine" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://iza-mine.github.io"
Repository = "https://github.com/iza-mine/passgate"
Issues = "https://github.com/iza-mine/passgate/issues"

[project.scripts]
passgate = "passgate:main"

[tool.setuptools]
py-modules = ["passgate"]
